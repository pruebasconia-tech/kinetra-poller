name: Kinetra Poller

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  secrets: write

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install ACP CLI
        run: npm install -g @virtuals-protocol/acp-cli

      - name: Configure ACP (headless)
        env:
          ACP_CONFIG_JSON: ${{ secrets.ACP_CONFIG_JSON }}
          ACP_SIGNER_KEYS_JSON: ${{ secrets.ACP_SIGNER_KEYS_JSON }}
          ACP_ACCESS_TOKEN: ${{ secrets.ACP_ACCESS_TOKEN }}
          ACP_REFRESH_TOKEN: ${{ secrets.ACP_REFRESH_TOKEN }}
          ACP_OWNER_WALLET: ${{ secrets.ACP_OWNER_WALLET }}
        run: |
          mkdir -p ~/.config/acp ~/.config/acp-cli
          echo "$ACP_CONFIG_JSON" > ~/.config/acp/config.json
          echo "$ACP_SIGNER_KEYS_JSON" > ~/.config/acp-cli/signer-keys.json
          acp configure --token "$ACP_ACCESS_TOKEN" --refresh-token "$ACP_REFRESH_TOKEN" --wallet "$ACP_OWNER_WALLET"
          acp agent whoami

      - name: Poll for new jobs
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: bash scripts/poll.sh

      - name: Persist refreshed tokens
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACP_OWNER_WALLET: ${{ secrets.ACP_OWNER_WALLET }}
        run: |
          # Extract current tokens from file backend
          node <<'NODEEOF' > /tmp/tokens.env
          const modPath = '/usr/local/lib/node_modules/@virtuals-protocol/acp-cli/node_modules/cross-keychain';
          const { getPassword } = require(modPath);
          const wallet = process.env.ACP_OWNER_WALLET.toLowerCase();
          (async () => {
            try {
              const at = await getPassword('acp-auth', 'access-token-' + wallet);
              const rt = await getPassword('acp-auth', 'refresh-token-' + wallet);
              if (at) console.log('ACCESS_TOKEN=' + at);
              if (rt) console.log('REFRESH_TOKEN=' + rt);
            } catch (e) {
              console.error('token read error:', e.message);
            }
          })();
          NODEEOF
          # Update secrets if tokens were extracted
          if grep -q "ACCESS_TOKEN=" /tmp/tokens.env; then
            NEW_AT=$(grep "ACCESS_TOKEN=" /tmp/tokens.env | head -1 | cut -d= -f2-)
            NEW_RT=$(grep "REFRESH_TOKEN=" /tmp/tokens.env | head -1 | cut -d= -f2-)
            echo "$NEW_AT" | gh secret set ACP_ACCESS_TOKEN --repo ${{ github.repository }}
            echo "$NEW_RT" | gh secret set ACP_REFRESH_TOKEN --repo ${{ github.repository }}
            echo "Tokens updated successfully"
          else
            echo "No tokens extracted, skipping update"
          fi

      - name: Commit state changes
        run: |
          git config user.name "kinetra-bot"
          git config user.email "kinetra-bot@users.noreply.github.com"
          git add state/known_jobs.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update known jobs state"
            git push
          fi