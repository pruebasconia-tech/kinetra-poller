name: Kinetra Poller

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install ACP CLI
        run: npm install -g @virtuals-protocol/acp-cli

      - name: Load tokens
        id: load_tokens
        env:
          ACP_CONFIG_JSON: ${{ secrets.ACP_CONFIG_JSON }}
          ACP_SIGNER_KEYS_JSON: ${{ secrets.ACP_SIGNER_KEYS_JSON }}
          ACP_ACCESS_TOKEN: ${{ secrets.ACP_ACCESS_TOKEN }}
          ACP_REFRESH_TOKEN: ${{ secrets.ACP_REFRESH_TOKEN }}
          ACP_OWNER_WALLET: ${{ secrets.ACP_OWNER_WALLET }}
        run: |
          mkdir -p ~/.config/acp ~/.config/acp-cli state
          echo "$ACP_CONFIG_JSON" > ~/.config/acp/config.json
          echo "$ACP_SIGNER_KEYS_JSON" > ~/.config/acp-cli/signer-keys.json
          # Use persisted tokens if available, otherwise secrets
          if [ -f state/tokens.json ]; then
            echo "Using persisted tokens from state/tokens.json"
            AT=$(python3 -c "import json; print(json.load(open('state/tokens.json'))['access_token'])")
            RT=$(python3 -c "import json; print(json.load(open('state/tokens.json'))['refresh_token'])")
          else
            echo "Using tokens from secrets"
            AT="$ACP_ACCESS_TOKEN"
            RT="$ACP_REFRESH_TOKEN"
          fi
          echo "ACCESS_TOKEN=$AT" >> $GITHUB_ENV
          echo "REFRESH_TOKEN=$RT" >> $GITHUB_ENV
          echo "OWNER_WALLET=$ACP_OWNER_WALLET" >> $GITHUB_ENV

      - name: Configure ACP (headless)
        run: |
          acp configure --token "$ACCESS_TOKEN" --refresh-token "$REFRESH_TOKEN" --wallet "$OWNER_WALLET"
          acp agent whoami

      - name: Poll for new jobs
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: bash scripts/poll.sh

      - name: Save refreshed tokens
        env:
          OWNER_WALLET: ${{ secrets.ACP_OWNER_WALLET }}
        run: |
          # Find cross-keychain module (fast, no filesystem scan)
          NPM_ROOT=$(npm root -g)
          CK_DIR="$NPM_ROOT/@virtuals-protocol/acp-cli/node_modules/cross-keychain"
          if [ ! -f "$CK_DIR/dist/index.js" ]; then
            echo "cross-keychain not found at $CK_DIR, skipping token save"
            exit 0
          fi
          node -e "
            const { getPassword } = require('$CK_DIR/dist');
            const wallet = process.env.OWNER_WALLET.toLowerCase();
            (async () => {
              try {
                const at = await getPassword('acp-auth', 'access-token-' + wallet);
                const rt = await getPassword('acp-auth', 'refresh-token-' + wallet);
                const fs = require('fs');
                fs.writeFileSync('state/tokens.json', JSON.stringify({
                  access_token: at,
                  refresh_token: rt
                }, null, 2));
                console.log('Tokens saved successfully');
              } catch (e) {
                console.error('Token save error:', e.message);
              }
            })();
          "

      - name: Commit state changes
        run: |
          git config user.name "kinetra-bot"
          git config user.email "kinetra-bot@users.noreply.github.com"
          git add state/known_jobs.json state/tokens.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update state"
            git push
          fi